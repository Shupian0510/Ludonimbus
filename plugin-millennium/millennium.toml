[plugin]
id = "io.github.shupian0510.ludonimbus"
name = "Ludonimbus"
version = "0.4.0"
author = "Shupian0510"
description = "Shows Ludonimbus cloud save status on Steam game pages. 在 Steam 游戏详情页显示 Ludonimbus 的云存档状态。"

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = "dist/ludonimbus.star"
