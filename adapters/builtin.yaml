# Godot 游戏，用户数据在 %APPDATA%\SMB1R
- key: smb1r
  name: 超级马力欧兄弟
  platform: Super Mario Bros. Remastered（同人重制）
  recomplauncher: [super-mario-bros-remastered-public]
  match: { exe: SMB1R.exe }
  saves: ["{appdata}/SMB1R/**"]
  exclude: ["{appdata}/SMB1R/logs/**", "{appdata}/SMB1R/shader_cache/**", "{appdata}/SMB1R/vulkan/**"]
