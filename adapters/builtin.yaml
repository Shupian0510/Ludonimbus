# 默认在 %APPDATA%\perfectdark，加 --portable 启动时在程序目录
- key: perfect-dark
  name: 完美黑暗
  platform: Perfect Dark（N64 移植）
  recomplauncher: [perfect-dark, perfect-dark-dabs-mod]
  match: { exe: [pd.x86_64.exe, pd.i686.exe, pd.exe] }
  saves: ["{appdata}/perfectdark/*.bin", "{install}/eeprom.bin"]

- key: unleashed-recomp
  name: 索尼克：释放
  platform: Unleashed Recompiled（Xbox 360）
  recomplauncher: [unleashedrecomp]
  match: { exe: UnleashedRecomp.exe }
  # 程序目录有 portable.txt 时存在程序目录
  saves:
    - "{appdata}/UnleashedRecomp/save/**"
    - "{appdata}/UnleashedRecomp/mlsave/**"
    - "{install}/save/**"
    - "{install}/mlsave/**"

