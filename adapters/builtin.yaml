# Ludonimbus 内置存档规则（适配器）
#
# 路径写法：每条路径以 {根目录名} 开头，后面接相对路径或通配符。
# 可用的根目录：
#   {install}       游戏目录（Ludonimbus 记录的 exe 所在文件夹；match 写了子文件夹时是发布包的根目录）
#   {home}          用户目录
#   {appdata}       %APPDATA%（Roaming）
#   {localappdata}  %LOCALAPPDATA%
#   {documents}     文档
#   以及在 roots 里自定义的根目录（可以引用 {env:变量名} 和上面这些；
#   用 | 分隔几个候选位置时用第一个存在的，都不存在时用最后一个）
#
# 字段：
#   match      用来从 Steam 快捷方式识别游戏：
#                exe      文件名（可以列多个；* 匹配任意字符），或相对 {install} 的路径（game/x.exe）
#                sibling  同目录必须有的文件（可选）
#                args     启动参数里必须包含的文字（可选）
#   recomplauncher  RecompLauncher 里的游戏 id（它建的 Steam 快捷方式是 recomplauncher.exe --play <id>）
#   saves      要同步的存档
#   exclude    排除的文件
#   waitFor    游戏真正的进程名（启动器会先退出时用来判断游戏是否还在运行）
#   quiesce    这些文件存在时说明游戏还在写存档，要等它们消失
#   relocate   游戏换到新文件夹（比如解压了新版本）时怎么自动找到它
#   uploadOnGameExit  游戏进程（waitFor）一退出就上传，不等一直开着的启动器关闭

- key: zelda-oot-longshot
  name: 塞尔达传说：时之笛
  platform: Longshot（原生重制）
  match: { exe: LongshotLauncher.exe }
  roots: { data: "{appdata}/Longshot" }
  saves: ["{data}/save/**"]
  exclude: ["{data}/save-work/**"]
  waitFor: ["longshot.exe"]
  quiesce: { absent: ["{data}/save-work/*.lock"] }
  uploadOnGameExit: true

- key: fe-fortunes-weave
  name: 火焰纹章：万缕千丝
  platform: fefw recomp
  recomplauncher: [fefw-recomp, fefw-recomp-2]
  match: { exe: fefw.exe }
  saves: ["{install}/save/**"]
  waitFor: ["fefw.exe"]
  relocate: { exe: fefw.exe, dirPattern: "fefw-recomp-*" }

- key: bloodborne-lantern
  name: Bloodborne
  platform: Lantern Engine（shadPS4）
  recomplauncher: [lanternengine]
  match: { exe: Bloodborne.exe, sibling: "Lantern Engine.exe" }
  saves: ["{install}/user/savedata/1/CUSA00207/**"]
  exclude: ["{install}/user/launcher-backups/**", "{install}/user/cache/**"]
  waitFor: ["Lantern Engine.exe"]
  relocate: { exe: Bloodborne.exe, sibling: "Lantern Engine.exe" }

