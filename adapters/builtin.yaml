  name: 星际火狐64
  platform: Starship（N64 移植）
  recomplauncher: [starship]
  match: { exe: Starship.exe }
  saves: ["{install}/default.sav"]

- key: spaghettikart
  name: 马力欧卡丁车64
  platform: SpaghettiKart（N64 移植）
  recomplauncher: [spaghettikart]
  match: { exe: Spaghettify.exe }
  saves: ["{install}/default.sav"]

- key: sm64coopdx
  name: 超级马力欧64（联机版）
  platform: sm64coopdx（N64 移植）
  recomplauncher: [sm64coopdx]
  match: { exe: sm64coopdx.exe }
  saves: ["{appdata}/sm64coopdx/sm64_save_file.bin", "{appdata}/sm64ex-coop/sm64_save_file.bin"]

