# Games whose saves are the same files on several platforms. Their versions
# (e.g. Steam and Switch) are one game in the save library, and saves move
# between them as they are. Used by crates/core/src/crosssaves.rs
# (docs/plan-phase5.md §5.6).
#
# Without a rule, only versions on the same platform are one game: saves of
# different platforms usually differ (an Xbox app version's containers are
# converted by xbox-saves.yaml instead).
#
# `id`:      stable name of the rule; versions it covers get the library id
#            `fmt:<id>`.
# `ids`:     which versions it covers, by library id: `nx:<title id>` (a Switch
#            game, on the console or in an emulator), `ludusavi:<title>` (a PC
#            version Ludusavi knows), `name:<name>` (any version with that
#            name, letters and digits only, lowercase).
# `folders`: where the saves are on each platform (save scope: `pc`,
#            `switch`, …): the ending of the folder's path, or `{nxsave}` for
#            a Switch game's save data itself.
# `files`:   which files in that folder are saves (a wildcard, relative to
#            the folder); other files (settings) stay where they are.
# `version`: how to read the game version that wrote a save: `file` (a
#            wildcard relative to the folder) and the XML element `xml`.
# `newerOnly`: an older game can't load a save a newer one wrote.
# `checked`: what has been tried for real (for maintainers).

- id: stardew-valley
  name: Stardew Valley
  ids:
    - nx:0100E65002BB8000
    - ludusavi:stardew valley
    - name:stardewvalley
  folders:
    pc: StardewValley/Saves
    switch: "{nxsave}"
  # One folder per farm (`Farm_123456789/`): the save, SaveGameInfo and
  # their `_old` copies.
  files: "*/*"
  version:
    file: "*/SaveGameInfo"
    xml: gameVersion
  newerOnly: true
  checked: >-
    Format and transfer steps per stardewvalleywiki.com/Saves (Switch to and
    from PC/Android with JKSV). Not yet tried with Ludonimbus on a real
    Switch or in an emulator.
