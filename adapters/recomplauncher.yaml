# 由 scripts/import-recomplauncher.py 生成，不要手动修改。
# 想修正某个游戏：在 builtin.yaml 里写一条同 key 的规则（手写规则优先）。
#
# 来源：RecompLauncher 的游戏目录（pc-catalog.json，2026-11-23）
#   - 开发者在 recomplauncher.json 里声明的存档位置：111 个
#   - N64Recomp 游戏（存档在 <应用文件夹>/saves）：21 个
# RecompLauncher：https://recomplauncher.com/  https://github.com/elripalda/RecompLauncher
#
# {install} 是发布包的根目录：exe 在子文件夹里时 match 写的是相对路径。

- key: "dusklight"
  name: "The Legend of Zelda: Twilight Princess"
  platform: "Dusklight（GameCube）"
  recomplauncher: ["dusklight"]
  match: { exe: ["dusklight.exe"] }
  saves:
    - "{install}/data/USA"
    - "{install}/data/EUR"
    - "{install}/data/JAP"
    - "{install}/data/MemoryCard*.raw"
    - "{install}/data/*.gci"
    - "{install}/data/states.json"
    - "{appdata}/TwilitRealm/Dusklight/USA"
    - "{appdata}/TwilitRealm/Dusklight/EUR"
    - "{appdata}/TwilitRealm/Dusklight/JAP"
    - "{appdata}/TwilitRealm/Dusklight/MemoryCard*.raw"
    - "{appdata}/TwilitRealm/Dusklight/*.gci"
    - "{appdata}/TwilitRealm/Dusklight/states.json"
    - "{appdata}/TwilitRealm/Dusk/USA"
    - "{appdata}/TwilitRealm/Dusk/EUR"
    - "{appdata}/TwilitRealm/Dusk/JAP"
    - "{appdata}/TwilitRealm/Dusk/MemoryCard*.raw"
    - "{appdata}/TwilitRealm/Dusk/*.gci"
    - "{appdata}/TwilitRealm/Dusk/states.json"
  waitFor: ["dusklight.exe"]
  skipJunk: true

