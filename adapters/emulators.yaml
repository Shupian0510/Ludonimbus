# Ludonimbus 内置模拟器规则
#
# 写法和 builtin.yaml 相同，另外：
#   kind: emulator   多个游戏共用这个模拟器
#   roots 里可以用 | 列出几个候选位置：用第一个存在的；都不存在时用最后一个
#     （一般把便携版的位置写在前面，安装版的默认位置写在最后）
#   saves      认不出是哪个游戏时（例如只打开了模拟器）同步整个模拟器的存档
#   gameId     怎么认出快捷方式启动的是哪个游戏，见 crates/core/src/emulators.rs
#   gameSaves  一个游戏的存档，<占位符> 由游戏 ID 填入；按游戏类型分组（default，或 gc / wii）
#
# 游戏本体备份（docs/plan-game-backup.md 第 8 节）用的字段：
#   gameFiles       除了快捷方式指向的光盘镜像 / 游戏文件夹以外，这个游戏自己的文件（更新、DLC），写法同 gameSaves
#   gameConfig      这个游戏自己的设置、材质包、mods，写法同 gameSaves
#   programExclude  备份模拟器程序时去掉的、属于所有游戏的数据（装进模拟器的游戏、主机存储、缓存）
#   firmware        密钥、固件、BIOS：用户在卡片里勾选后才备份
#
# 只同步存档：不含密钥、固件、着色器缓存、即时存档（state）。
# Switch 模拟器的存档文件夹和本机的用户档案、存档编号绑定，换到另一台电脑后对不上：
# Ryujinx 按游戏同步时在每台电脑上查存档编号（没有就新建），其他 Switch 模拟器整个一起同步（连同用户档案）。

# --- 任天堂 ---------------------------------------------------------------

- key: dolphin
  name: Dolphin
  kind: emulator
  platform: GameCube / Wii 模拟器
  match: { exe: [Dolphin.exe, DolphinQt2.exe, DolphinWX.exe] }
  roots: { emu: "{install}/User|{documents}/Dolphin Emulator|{appdata}/Dolphin Emulator" }
  saves:
    - "{emu}/GC/*/Card ?/**"
    - "{emu}/GC/*.raw"
    - "{emu}/Wii/title/0001000?/*/data/**"
    - "{emu}/Wii/shared2/menu/FaceLib/**"
  gameId: gc-wii
  gameSaves:
    # GameCube 存档要用「GCI 文件夹」记忆卡（Dolphin 的默认设置）；.raw 记忆卡是所有游戏共用的
    gc: ["{emu}/GC/*/Card ?/<maker>-<id4>-*.gci"]
    wii: ["{emu}/Wii/title/0001000?/<id4hex>/data/**"]
  gameConfig:
    default: ["{emu}/GameSettings/<id>.ini", "{emu}/Load/Textures/<id>/**"]
  programExclude:
    - "{emu}/Cache/**"
    - "{emu}/Wii/**"
    - "{emu}/GC/**"
    - "{emu}/StateSaves/**"
    - "{emu}/ScreenShots/**"
    - "{emu}/Dump/**"
    - "{emu}/Logs/**"
    - "{emu}/Load/**"
    - "{emu}/GameSettings/**"
  firmware: ["{emu}/GC/*/IPL.bin", "{emu}/Wii/title/00000001/**", "{emu}/Wii/sys/**"]

- key: cemu
  name: Cemu
  kind: emulator
  platform: Wii U 模拟器
  match: { exe: Cemu.exe }
  roots: { mlc: "{install}/portable/mlc01|{install}/mlc01|{appdata}/Cemu/mlc01" }
  saves: ["{mlc}/usr/save/**"]
  gameId: wiiu
  gameSaves:
    default: ["{mlc}/usr/save/<high>/<low>/**"]
  # 装进 MLC 的游戏本体、更新（0005000e）、DLC（0005000c）
  gameFiles:
    default: ["{mlc}/usr/title/00050000/<low>/**", "{mlc}/usr/title/0005000e/<low>/**", "{mlc}/usr/title/0005000c/<low>/**"]
  gameConfig:
    default: ["{install}/gameProfiles/<high><low>.ini"]
  programExclude: ["{mlc}/**", "{install}/shaderCache/**", "{install}/log.txt", "{install}/keys.txt", "{install}/gameProfiles/0005*.ini"]
  firmware: ["{install}/keys.txt", "{install}/portable/keys.txt", "{appdata}/Cemu/keys.txt", "{mlc}/sys/**"]

- key: azahar
  name: Azahar
  kind: emulator
  platform: 3DS 模拟器
  match: { exe: [azahar.exe, azahar-qt.exe] }
  roots: { user: "{install}/user|{appdata}/Azahar" }
  saves: &n3ds-saves
    - "{user}/sdmc/Nintendo 3DS/*/*/title/*/*/data/**"
    - "{user}/sdmc/Nintendo 3DS/*/*/extdata/**"
  gameId: 3ds
  gameSaves: &n3ds-game
    default: ["{user}/sdmc/Nintendo 3DS/*/*/title/<high>/<low>/data/**"]

- key: citra
  name: Citra
  kind: emulator
  platform: 3DS 模拟器
  match: { exe: [citra-qt.exe, citra.exe] }
  roots: { user: "{install}/user|{appdata}/Citra" }
  saves: *n3ds-saves
  gameId: 3ds
  gameSaves: *n3ds-game

- key: lime3ds
  name: Lime3DS
  kind: emulator
  platform: 3DS 模拟器
  match: { exe: [lime3ds-gui.exe, lime3ds.exe, lime-qt.exe] }
  roots: { user: "{install}/user|{appdata}/Lime3DS" }
  saves: *n3ds-saves
  gameId: 3ds
  gameSaves: *n3ds-game

- key: ryujinx
  name: Ryujinx
  kind: emulator
  platform: Switch 模拟器
  match: { exe: [Ryujinx.exe, Ryujinx.Ava.exe] }
  roots: { emu: "{install}/portable|{appdata}/Ryujinx" }
  # 整个模拟器：存档按本机分配的编号存放，编号表在 bis/system/save/8000000000000000
  saves:
    - "{emu}/bis/user/save/**"
    - "{emu}/bis/user/saveMeta/**"
    - "{emu}/bis/system/save/8000000000000000/**"
    - "{emu}/system/Profiles.json"
  exclude: ["{emu}/**/.lock"]
  # 单个游戏：{nxsave-…} 是本机当前用户档案的这个游戏的存档，{nxdevice-…} 是它的设备存档
  # （bis/user/save/<编号>/0）。编号在每台电脑上查存档索引，恢复时没有就新建，见 crates/core/src/switch.rs
  gameId: switch
  gameSaves:
    default: ["{nxsave-<id>}/**", "{nxdevice-<id>}/**"]
  # games/<标题 ID>/ 里有这个游戏的更新和 DLC 列表；列表指向的文件还不会备份（plan 第 8.4 节）
  gameConfig:
    default: ["{emu}/games/<id>/*.json", "{emu}/mods/contents/<id>/**"]
  programExclude: ["{emu}/bis/**", "{emu}/sdcard/**", "{emu}/system/**", "{emu}/games/**", "{emu}/mods/**", "{emu}/Logs/**", "{emu}/screenshots/**"]
  firmware: ["{emu}/system/prod.keys", "{emu}/system/title.keys", "{emu}/bis/system/Contents/registered/**"]

- key: eden
  name: Eden
  kind: emulator
  platform: Switch 模拟器
  match: { exe: eden.exe }
  roots: { user: "{install}/user|{appdata}/eden" }
  saves: &yuzu-saves
    - "{user}/nand/user/save/**"
    - "{user}/nand/system/save/8000000000000010/su/avators/**"

- key: citron
  name: Citron
  kind: emulator
  platform: Switch 模拟器
  match: { exe: citron.exe }
  roots: { user: "{install}/user|{appdata}/citron" }
  saves: *yuzu-saves

- key: sudachi
  name: Sudachi
  kind: emulator
  platform: Switch 模拟器
  match: { exe: sudachi.exe }
  roots: { user: "{install}/user|{appdata}/sudachi" }
  saves: *yuzu-saves

- key: suyu
  name: Suyu
  kind: emulator
  platform: Switch 模拟器
  match: { exe: suyu.exe }
  roots: { user: "{install}/user|{appdata}/suyu" }
  saves: *yuzu-saves

- key: yuzu
  name: yuzu
  kind: emulator
  platform: Switch 模拟器（含 torzu 等分支）
  match: { exe: yuzu.exe }
  roots: { user: "{install}/user|{appdata}/yuzu" }
  saves: *yuzu-saves

# --- 索尼 -----------------------------------------------------------------

- key: shadps4
  name: shadPS4
  kind: emulator
  platform: PS4 模拟器
  match: { exe: shadPS4.exe }
  roots: { user: "{install}/user|{appdata}/shadPS4" }
  saves: ["{user}/savedata/**"]
  gameId: ps4
  gameSaves:
    default: ["{user}/savedata/1/<id>/**"]
  programExclude: ["{user}/savedata/**", "{user}/shader/**", "{user}/log/**", "{user}/screenshots/**", "{user}/sys_modules/**"]
  firmware: ["{user}/sys_modules/**"]

- key: rpcs3
  name: RPCS3
  kind: emulator
  platform: PS3 模拟器
  match: { exe: rpcs3.exe }
  saves: ["{install}/dev_hdd0/home/00000001/savedata/**"]
  gameId: ps3
  gameSaves:
    default: ["{install}/dev_hdd0/home/00000001/savedata/<id>*/**"]
  # dev_hdd0/game/<序列号> 是装进 RPCS3 的游戏更新和数字版游戏
  gameFiles:
    default: ["{install}/dev_hdd0/game/<id>/**"]
  gameConfig:
    default: ["{install}/config/custom_configs/config_<id>.yml"]
  programExclude: ["{install}/dev_hdd0/**", "{install}/dev_hdd1/**", "{install}/dev_flash/**", "{install}/dev_usb000/**", "{install}/cache/**", "{install}/games/**", "{install}/config/custom_configs/**"]
  firmware: ["{install}/dev_flash/**"]

- key: pcsx2
  name: PCSX2
  kind: emulator
  platform: PS2 模拟器
  match: { exe: "pcsx2*.exe" }
  # 记忆卡是所有游戏共用的，只能整体同步
  roots: { cards: "{install}/memcards|{documents}/PCSX2/memcards" }
  saves: ["{cards}/**"]

- key: duckstation
  name: DuckStation
  kind: emulator
  platform: PS1 模拟器
  match: { exe: "duckstation*.exe" }
  roots: { cards: "{install}/memcards|{documents}/DuckStation/memcards|{localappdata}/DuckStation/memcards" }
  saves: ["{cards}/**"]

- key: ppsspp
  name: PPSSPP
  kind: emulator
  platform: PSP 模拟器
  match: { exe: "PPSSPPWindows*.exe" }
  roots: { emu: "{install}/memstick|{documents}/PPSSPP|{install}/memstick" }
  saves: ["{emu}/PSP/SAVEDATA/**"]
  gameId: psp
  gameSaves:
    default: ["{emu}/PSP/SAVEDATA/<id>*/**"]

- key: vita3k
  name: Vita3K
  kind: emulator
  platform: PS Vita 模拟器
  match: { exe: Vita3K.exe }
  roots: { ux0: "{install}/ux0|{appdata}/Vita3K/Vita3K/ux0" }
  saves: ["{ux0}/user/00/savedata/**"]
  gameId: vita
  gameSaves:
    default: ["{ux0}/user/00/savedata/<id>/**"]

# --- 微软 -----------------------------------------------------------------

- key: xenia
  name: Xenia
  kind: emulator
  platform: Xbox 360 模拟器
  match: { exe: [xenia_canary.exe, xenia.exe] }
  roots: { content: "{install}/content|{documents}/Xenia/content" }
  # 00000001 是存档；DLC（00000002）和更新（000B0000）不同步
  saves:
    - "{content}/*/00000001/**"
    - "{content}/*/*/00000001/**"
    - "{content}/*/profile/**"
    - "{content}/0000000000000000/FFFE07D1/**"

# --- 多平台 ---------------------------------------------------------------

- key: retroarch
  name: RetroArch
  kind: emulator
  platform: 多平台模拟器
  match: { exe: retroarch.exe }
  saves: ["{install}/saves/**"]
  gameId: rom
  gameSaves:
    default: ["{install}/saves/**/<stem>.*"]
