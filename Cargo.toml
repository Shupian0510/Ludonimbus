[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/runner", "crates/agent", "app/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Shupian0510/Ludonimbus"

[workspace.dependencies]
ludonimbus-core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# The TypeScript types of what the desktop app's web UI and its Rust side
# send each other (app/src/bindings), generated from the Rust types; see
# docs/development.md. Large integers are numbers there (bindings.rs).
ts-rs = { version = "=12.0.1", features = ["serde-compat", "chrono-impl"] }

# Clippy runs in CI with warnings as errors (docs/development.md). These
# lints are off because they don't fit how the code is written: ureq's error
# type is large and returned everywhere a request is made, outcomes are
# returned once per operation and never stored in bulk, and a few helpers
# take many plain arguments on purpose.
[workspace.lints.clippy]
result_large_err = "allow"
large_enum_variant = "allow"
type_complexity = "allow"
too_many_arguments = "allow"

# Build profiles: see .cargo/config.toml
