[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/runner", "app/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Shupian0510/Ludonimbus"

[workspace.dependencies]
ludonimbus-core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Build profiles: see .cargo/config.toml
