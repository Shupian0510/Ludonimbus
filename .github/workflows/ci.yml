name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "website/**", "**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "website/**", "**/*.md", "LICENSE"]
  workflow_dispatch:

# A newer push to the same branch / PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # .cargo/config.toml holds the build profiles, which rust-cache does not hash itself.
          shared-key: debug-build-${{ hashFiles('.cargo/config.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            plugin-millennium/package-lock.json
      - name: Versions match
        shell: pwsh
        run: ./scripts/check-versions.ps1
      - name: Changelog has a bilingual entry for this version
        shell: pwsh
        run: ./scripts/changelog-section.ps1 -Version (./scripts/check-versions.ps1) | Out-Null
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Rust tests
        run: cargo test --workspace --exclude ludonimbus-app
      - name: Frontend build
        working-directory: app
        run: npm run build
      - name: Desktop app compiles
        shell: pwsh
        run: |
          ./scripts/prepare-sidecars.ps1
          cargo build -p ludonimbus-app

  # Linux (groundwork for Steam Deck / SteamOS, docs/plan-phase5.md): the
  # same tests, and the desktop app must compile. Nothing is packaged yet.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-debug-build-${{ hashFiles('.cargo/config.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: System libraries for the desktop app
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libsoup-3.0-dev libssl-dev libdbus-1-dev
      - name: Rust tests
        run: cargo test --locked --workspace --exclude ludonimbus-app
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Frontend build
        working-directory: app
        run: npm run build
      - name: Desktop app compiles
        run: |
          bash scripts/prepare-sidecars.sh --stand-ins
          cargo build --locked -p ludonimbus-app

  # Installer for every commit on main, kept as a workflow artifact for 14
  # days. Not a release: the auto-updater never offers it. It also keeps the
  # release-profile cache warm for release.yml.
  dev-build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # .cargo/config.toml holds the build profiles, which rust-cache does not hash itself.
          shared-key: release-build-${{ hashFiles('.cargo/config.toml') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            plugin-millennium/package-lock.json
      - name: Build installer
        shell: pwsh
        env:
          LUDONIMBUS_GOOGLE_CLIENT_ID: ${{ secrets.LUDONIMBUS_GOOGLE_CLIENT_ID }}
          LUDONIMBUS_GOOGLE_CLIENT_SECRET: ${{ secrets.LUDONIMBUS_GOOGLE_CLIENT_SECRET }}
          LUDONIMBUS_BAIDU_APP_KEY: ${{ secrets.LUDONIMBUS_BAIDU_APP_KEY }}
          LUDONIMBUS_BAIDU_SECRET_KEY: ${{ secrets.LUDONIMBUS_BAIDU_SECRET_KEY }}
          LUDONIMBUS_BAIDU_APP_NAME: ${{ secrets.LUDONIMBUS_BAIDU_APP_NAME }}
        run: |
          ./scripts/prepare-sidecars.ps1 -Release
          cd app
          npm ci
          npx tauri build
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }
      - name: Short commit id
        id: sha
        shell: pwsh
        run: '"short=$("${{ github.sha }}".Substring(0, 7))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'
      - uses: actions/upload-artifact@v4
        with:
          name: Ludonimbus-dev-${{ steps.sha.outputs.short }}
          path: target/release/bundle/nsis/*.exe
          retention-days: 14

  # Linux / Steam Deck preview build for every commit on main (workflow
  # artifact, 14 days): the AppImage, the launch wrapper and the background
  # service with the install script, and the Decky plugin.
  linux-dev-build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-release-build-${{ hashFiles('.cargo/config.toml') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            plugin-decky/package-lock.json
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libsoup-3.0-dev libssl-dev libdbus-1-dev libfuse2 file
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          LUDONIMBUS_GOOGLE_CLIENT_ID: ${{ secrets.LUDONIMBUS_GOOGLE_CLIENT_ID }}
          LUDONIMBUS_GOOGLE_CLIENT_SECRET: ${{ secrets.LUDONIMBUS_GOOGLE_CLIENT_SECRET }}
        run: |
          bash scripts/prepare-sidecars.sh --release
          cargo build --locked --release -p ludonimbus-agent
          cd app
          npm ci
          npx tauri build --bundles appimage
      - name: Pack the Linux download
        run: |
          out=Ludonimbus-linux-x86_64
          mkdir -p "$out"
          cp target/release/bundle/appimage/*.AppImage "$out/"
          cp target/release/ludonimbus-run target/release/ludonimbus-agent "$out/"
          cp scripts/install-linux.sh "$out/"
          cp app/src-tauri/icons/128x128@2x.png "$out/ludonimbus.png"
          chmod +x "$out"/*.AppImage "$out"/ludonimbus-run "$out"/ludonimbus-agent "$out"/install-linux.sh
          tar czf "$out.tar.gz" "$out"
      - name: Decky plugin
        working-directory: plugin-decky
        run: |
          npm ci
          npm run build
          mkdir -p Ludonimbus
          cp -r dist main.py plugin.json package.json Ludonimbus/
          cp ../LICENSE Ludonimbus/
          zip -r ../Ludonimbus-decky.zip Ludonimbus
      - name: Short commit id
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Ludonimbus-linux-dev-${{ steps.sha.outputs.short }}
          path: |
            Ludonimbus-linux-x86_64.tar.gz
            Ludonimbus-decky.zip
          retention-days: 14
