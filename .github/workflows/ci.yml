name: CI

# Runs for every pull request, and for every push to dev (the next version)
# and main (the released version). The whole pipeline is described in
# docs/release-process.md.
#
# "ok" is the one check the branch rules require. It always reports, also
# when a change only touches documentation and the builds are skipped.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: "Also build the installers from this branch (development build)"
        type: boolean
        default: false

# A newer push to the same pull request cancels the run in progress. Runs on
# dev and main always finish: each of them leaves a development build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Changes to documentation alone skip the builds. When it is unclear what
  # changed, the builds run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^(docs/|website/)|\.md$|^LICENSE$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  # Cheap checks that every change gets, documentation included.
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull requests into main come from dev, hotfix/* or docs/*
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          case "$HEAD" in
            dev|hotfix/*|docs/*) ;;
            *)
              echo "::error::New work goes into dev. Change this pull request's base branch to dev (Edit, next to the title). main only takes releases (dev), fixes of the released version (hotfix/*) and corrections of its documentation (docs/*)."
              exit 1
              ;;
          esac
      - name: Versions match
        shell: pwsh
        run: ./scripts/check-versions.ps1
      - name: Changelog has a bilingual entry for this version
        shell: pwsh
        run: ./scripts/changelog-section.ps1 -Version (./scripts/check-versions.ps1) | Out-Null
      # The documentation site is deployed from main (docs.yml); building it
      # here catches dead links and a broken changelog page before that.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Documentation site builds
        working-directory: website
        run: |
          npm ci
          npm run build

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # .cargo/config.toml holds the build profiles, which rust-cache does not hash itself.
          shared-key: debug-build-${{ hashFiles('.cargo/config.toml') }}
          # Pull requests read the cache of the branch they go into.
          save-if: ${{ github.event_name == 'push' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            plugin-millennium/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Rust tests
        run: cargo test --workspace --exclude ludonimbus-app
      - name: Frontend build
        working-directory: app
        run: npm run build
      # Also builds and type-checks the Steam plugin (scripts/build-plugin.ps1).
      - name: Desktop app compiles
        shell: pwsh
        run: |
          ./scripts/prepare-sidecars.ps1
          cargo build -p ludonimbus-app
      # Needs the frontend build and the sidecars above, so it is not part of
      # the workspace tests.
      - name: Desktop app tests
        run: cargo test -p ludonimbus-app
      # The web UI's types for what it and Rust send each other are generated
      # from the Rust types into app/src/bindings (docs/development.md).
      # Generating them again must change nothing, and add no file.
      - name: Generated TypeScript types are up to date
        shell: bash
        run: |
          cargo test -p ludonimbus-app export_bindings
          git add --intent-to-add app/src/bindings
          if ! git diff --exit-code app/src/bindings; then
            echo "::error::app/src/bindings is out of date: run 'cargo test -p ludonimbus-app export_bindings' and commit the result."
            exit 1
          fi
      # Windows-only code is linted here, the rest on Linux too.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Linux (Steam Deck / SteamOS): the same tests, the desktop app must
  # compile, and the Decky plugin must type-check and build.
  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting (rustfmt.toml)
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-debug-build-${{ hashFiles('.cargo/config.toml') }}
          save-if: ${{ github.event_name == 'push' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            plugin-decky/package-lock.json
      - name: System libraries for the desktop app
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libsoup-3.0-dev libssl-dev libdbus-1-dev
      - name: Rust tests
        run: cargo test --locked --workspace --exclude ludonimbus-app
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Frontend build
        working-directory: app
        run: npm run build
      - name: Desktop app compiles
        run: |
          bash scripts/prepare-sidecars.sh --stand-ins
          cargo build --locked -p ludonimbus-app
      - name: Desktop app tests
        run: cargo test --locked -p ludonimbus-app
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Decky plugin
        working-directory: plugin-decky
        run: |
          npm ci
          npm run check
          npm run build

  ok:
    if: always()
    needs: [changes, meta, test, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

  # Development build: the Windows installer for every change that lands on
  # dev or main, kept as a workflow artifact. Not a release: it is not on the
  # Releases page and the auto-updater never offers it. Its version is the
  # one in the tree plus "-dev.<run number>" (scripts/set-build-version.ps1).
  windows-build:
    needs: [changes, ok]
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || inputs.build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # .cargo/config.toml holds the build profiles, which rust-cache does not hash itself.
          shared-key: release-build-${{ hashFiles('.cargo/config.toml') }}
          save-if: ${{ github.event_name == 'push' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            plugin-millennium/package-lock.json
      - name: Version of this build
        id: version
        shell: pwsh
        run: |
          $version = ./scripts/set-build-version.ps1 -Suffix "dev.${{ github.run_number }}"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build installer
        shell: pwsh
        env:
          LUDONIMBUS_GOOGLE_CLIENT_ID: ${{ secrets.LUDONIMBUS_GOOGLE_CLIENT_ID }}
          LUDONIMBUS_GOOGLE_CLIENT_SECRET: ${{ secrets.LUDONIMBUS_GOOGLE_CLIENT_SECRET }}
          LUDONIMBUS_BAIDU_APP_KEY: ${{ secrets.LUDONIMBUS_BAIDU_APP_KEY }}
          LUDONIMBUS_BAIDU_SECRET_KEY: ${{ secrets.LUDONIMBUS_BAIDU_SECRET_KEY }}
          LUDONIMBUS_BAIDU_APP_NAME: ${{ secrets.LUDONIMBUS_BAIDU_APP_NAME }}
        run: |
          ./scripts/prepare-sidecars.ps1 -Release
          cd app
          npm ci
          npx tauri build
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: Ludonimbus-dev.${{ github.run_number }}-windows
          path: target/release/bundle/nsis/*.exe
          retention-days: 30

  # The same for Linux / Steam Deck: the AppImage, the launch wrapper and the
  # background service with the install script, and the Decky plugin.
  linux-build:
    needs: [changes, ok]
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || inputs.build)
    uses: ./.github/workflows/linux-package.yml
    with:
      version-suffix: dev.${{ github.run_number }}
      artifact: Ludonimbus-dev.${{ github.run_number }}-linux
      retention-days: 30
      save-cache: ${{ github.event_name == 'push' }}
    secrets: inherit
