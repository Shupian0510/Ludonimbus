name: Release

# Push a tag like v1.0.0 (on main) to build the Windows installer and the
# Linux download, sign them, create the GitHub Release, and publish
# latest.json for in-app updates. docs/release-process.md has the steps.
#
# Rehearsal: run this workflow by hand (Actions → Release → Run workflow) on
# any branch. It builds everything the same way, as version
# "<version>-rc.<run number>", and stops before publishing: nothing appears
# on the Releases page, no update is offered, and SignPath is not asked. The
# files are kept as workflow artifacts for 14 days. This is the build to
# test before a release.
#
# Windows code signing goes through SignPath (free for open source, certificate
# by SignPath Foundation; setup in docs/code-signing.md). It turns on once the
# SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable exist;
# without them the installer is published unsigned. Each release sends two
# signing requests that wait for approval in SignPath: first the programs that
# go into the installer, then the installer built from them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read # SignPath downloads the files to sign from this run's artifacts

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGN: ${{ github.event_name == 'push' && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      # Reuse the release-profile cache that ci.yml's windows-build keeps warm
      # (caches saved on tags are not visible to later tags, so don't save).
      - uses: Swatinem/rust-cache@v2
        with:
          # .cargo/config.toml holds the build profiles, which rust-cache does not hash itself.
          shared-key: release-build-${{ hashFiles('.cargo/config.toml') }}
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            plugin-millennium/package-lock.json

      # A release: the tag must be the version in the tree. A rehearsal: the
      # build gets a release-candidate version of its own.
      - name: Version
        id: version
        shell: pwsh
        run: |
          $base = ./scripts/check-versions.ps1
          if ("${{ github.event_name }}" -eq "push") {
            if ("v$base" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $base" }
            $version = $base
          } else {
            $version = ./scripts/set-build-version.ps1 -Suffix "rc.${{ github.run_number }}"
          }
          "base=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer=Ludonimbus_${version}_x64-setup.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # release-notes.md feeds latest.json (the in-app dialog splits it at
      # "### English"); release-body.md is the GitHub Release text.
      - name: Release notes from CHANGELOG.md (must be bilingual)
        shell: pwsh
        run: |
          $notes = (./scripts/changelog-section.ps1 -Version "${{ steps.version.outputs.base }}") -join "`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8NoBOM -NoNewline
          if ($env:SIGN -eq 'true') {
            $notes += "`n`n---`n`n[Code signing policy](https://github.com/${{ github.repository }}#code-signing-policy)"
          }
          Set-Content -Path release-body.md -Value $notes -Encoding utf8NoBOM -NoNewline

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build sidecars (Steam wrapper + Ludusavi + Steam plugin)
        shell: pwsh
        env:
          LUDONIMBUS_GOOGLE_CLIENT_ID: ${{ secrets.LUDONIMBUS_GOOGLE_CLIENT_ID }}
          LUDONIMBUS_GOOGLE_CLIENT_SECRET: ${{ secrets.LUDONIMBUS_GOOGLE_CLIENT_SECRET }}
          LUDONIMBUS_BAIDU_APP_KEY: ${{ secrets.LUDONIMBUS_BAIDU_APP_KEY }}
          LUDONIMBUS_BAIDU_SECRET_KEY: ${{ secrets.LUDONIMBUS_BAIDU_SECRET_KEY }}
          LUDONIMBUS_BAIDU_APP_NAME: ${{ secrets.LUDONIMBUS_BAIDU_APP_NAME }}
        run: ./scripts/prepare-sidecars.ps1 -Release

      # Compile only; the installer is built after the programs are signed.
      - name: Build the app
        working-directory: app
        shell: pwsh
        env:
          LUDONIMBUS_GOOGLE_CLIENT_ID: ${{ secrets.LUDONIMBUS_GOOGLE_CLIENT_ID }}
          LUDONIMBUS_GOOGLE_CLIENT_SECRET: ${{ secrets.LUDONIMBUS_GOOGLE_CLIENT_SECRET }}
          LUDONIMBUS_BAIDU_APP_KEY: ${{ secrets.LUDONIMBUS_BAIDU_APP_KEY }}
          LUDONIMBUS_BAIDU_SECRET_KEY: ${{ secrets.LUDONIMBUS_BAIDU_SECRET_KEY }}
          LUDONIMBUS_BAIDU_APP_NAME: ${{ secrets.LUDONIMBUS_BAIDU_APP_NAME }}
        run: |
          npx tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      # Signing 1/2: our own programs. Ludusavi is an upstream release and is
      # shipped as published (SignPath only signs the project's own builds).
      - name: Collect programs to sign
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signing/programs | Out-Null
          Copy-Item target/release/ludonimbus-app.exe, target/release/ludonimbus-run.exe signing/programs/

      - name: Upload programs for signing
        id: upload-programs
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-programs
          path: signing/programs/
          retention-days: 1

      - name: Sign programs (approve the request in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Ludonimbus' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-programs.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signing/programs-signed

      - name: Put the signed programs in place
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $signed = "signing/programs-signed"
          foreach ($exe in "ludonimbus-app.exe", "ludonimbus-run.exe") {
            $sig = Get-AuthenticodeSignature "$signed/$exe"
            if ($sig.Status -ne "Valid") { throw "$exe is not signed: $($sig.Status) $($sig.StatusMessage)" }
            Write-Host "$exe signed by $($sig.SignerCertificate.Subject)"
            Copy-Item "$signed/$exe" "target/release/$exe" -Force
          }
          # The installer takes sidecars from app/src-tauri/binaries.
          $triple = (rustc -vV | Select-String "^host: (.+)$").Matches[0].Groups[1].Value
          Copy-Item "$signed/ludonimbus-run.exe" "app/src-tauri/binaries/ludonimbus-run-$triple.exe" -Force

      # --no-binary-patching: tauri would otherwise rewrite the main program
      # (to record "installed by NSIS"), breaking its signature. The updater
      # then looks up "windows-x86_64" instead of "windows-x86_64-nsis" in
      # latest.json; both entries are published, and it recognizes the NSIS
      # installer by its content.
      - name: Build the installer
        working-directory: app
        shell: pwsh
        run: |
          npx tauri bundle --bundles nsis --no-binary-patching
          if ($LASTEXITCODE -ne 0) { throw "tauri bundle failed" }

      # Signing 2/2: the installer.
      - name: Upload installer for signing
        id: upload-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: target/release/bundle/nsis/${{ steps.version.outputs.installer }}
          retention-days: 1

      - name: Sign installer (approve the request in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Ludonimbus' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signing/installer-signed

      - name: Put the signed installer in place
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $name = "${{ steps.version.outputs.installer }}"
          $sig = Get-AuthenticodeSignature "signing/installer-signed/$name"
          if ($sig.Status -ne "Valid") { throw "$name is not signed: $($sig.Status) $($sig.StatusMessage)" }
          Write-Host "$name signed by $($sig.SignerCertificate.Subject)"
          Copy-Item "signing/installer-signed/$name" "target/release/bundle/nsis/$name" -Force

      # The updater signature covers the final (Authenticode-signed) installer,
      # so it is made last.
      - name: Updater signature and latest.json
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = (Resolve-Path "target/release/bundle/nsis/${{ steps.version.outputs.installer }}").Path
          Push-Location app
          npx tauri signer sign --app-version $version $installer
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "updater signing failed" }
          ./scripts/updater-manifest.ps1 -Version $version `
            -Url "https://github.com/${{ github.repository }}/releases/download/v$version/${{ steps.version.outputs.installer }}" `
            -SignatureFile "$installer.sig" -NotesFile release-notes.md `
            -Out target/release/bundle/nsis/latest.json

      - name: Collect the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-files | Out-Null
          $dir = "target/release/bundle/nsis"
          $name = "${{ steps.version.outputs.installer }}"
          Copy-Item "$dir/$name", "$dir/$name.sig", "$dir/latest.json", release-body.md release-files/

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-files/
          retention-days: 14

  linux:
    uses: ./.github/workflows/linux-package.yml
    with:
      # Empty for a tag.
      version-suffix: ${{ github.event_name != 'push' && format('rc.{0}', github.run_number) || '' }}
      artifact: release-linux
      retention-days: 14
    secrets: inherit

  # Only for a tag: a rehearsal stops before this.
  publish:
    if: github.event_name == 'push'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: linux
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l windows linux
          # A draft left by an earlier failed run of this tag is replaced.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          # Upload as a draft first, so the updater never sees a release without latest.json.
          gh release create "$TAG" \
            windows/*.exe windows/*.sig windows/latest.json \
            linux/Ludonimbus-linux-x86_64.tar.gz linux/Ludonimbus-decky.zip \
            --verify-tag --draft --title "Ludonimbus $TAG" --notes-file windows/release-body.md
          gh release edit "$TAG" --draft=false --latest

  # Open a PR on microsoft/winget-pkgs for the new version. Needs the
  # WINGET_TOKEN secret (classic PAT, public_repo scope); skipped without it.
  winget:
    needs: publish
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      KOMAC_VERSION: 2.17.2
      KOMAC_SHA256: b03b020eec98acfb0b53e284a6e21815b884be33de6785b97e7a120f0e748966
    steps:
      - name: Submit to winget
        if: env.WINGET_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          curl -fsSL -o komac.tar.gz "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${KOMAC_SHA256}  komac.tar.gz" | sha256sum -c -
          tar -xzf komac.tar.gz komac
          ./komac update Shupian0510.Ludonimbus \
            --version "$version" \
            --urls "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Ludonimbus_${version}_x64-setup.exe" \
            --release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --submit
