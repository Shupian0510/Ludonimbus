name: Release

# Push a tag like v0.1.1 to build the signed installer, create the GitHub
# Release, and publish latest.json for in-app updates.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      # Reuse the release-profile cache that ci.yml's dev-build keeps warm on
      # main (caches saved on tags are not visible to later tags, so don't save).
      - uses: Swatinem/rust-cache@v2
        with:
          # .cargo/config.toml holds the build profiles, which rust-cache does not hash itself.
          shared-key: release-build-${{ hashFiles('.cargo/config.toml') }}
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            plugin-millennium/package-lock.json

      - name: Check version matches tag
        shell: pwsh
        run: |
          $version = ./scripts/check-versions.ps1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }

      - name: Release notes from CHANGELOG.md (must be bilingual)
        id: notes
        shell: pwsh
        run: |
          $body = (./scripts/changelog-section.ps1 -Version "${{ github.ref_name }}") -join "`n"
          $delim = "EOF_" + [guid]::NewGuid().ToString("N")
          "body<<$delim`n$body`n$delim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build sidecars (Steam wrapper + Ludusavi + Steam plugin)
        shell: pwsh
        env:
          LUDONIMBUS_GOOGLE_CLIENT_ID: ${{ secrets.LUDONIMBUS_GOOGLE_CLIENT_ID }}
          LUDONIMBUS_GOOGLE_CLIENT_SECRET: ${{ secrets.LUDONIMBUS_GOOGLE_CLIENT_SECRET }}
          LUDONIMBUS_BAIDU_APP_KEY: ${{ secrets.LUDONIMBUS_BAIDU_APP_KEY }}
          LUDONIMBUS_BAIDU_SECRET_KEY: ${{ secrets.LUDONIMBUS_BAIDU_SECRET_KEY }}
          LUDONIMBUS_BAIDU_APP_NAME: ${{ secrets.LUDONIMBUS_BAIDU_APP_NAME }}
        run: ./scripts/prepare-sidecars.ps1 -Release

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LUDONIMBUS_GOOGLE_CLIENT_ID: ${{ secrets.LUDONIMBUS_GOOGLE_CLIENT_ID }}
          LUDONIMBUS_GOOGLE_CLIENT_SECRET: ${{ secrets.LUDONIMBUS_GOOGLE_CLIENT_SECRET }}
          LUDONIMBUS_BAIDU_APP_KEY: ${{ secrets.LUDONIMBUS_BAIDU_APP_KEY }}
          LUDONIMBUS_BAIDU_SECRET_KEY: ${{ secrets.LUDONIMBUS_BAIDU_SECRET_KEY }}
          LUDONIMBUS_BAIDU_APP_NAME: ${{ secrets.LUDONIMBUS_BAIDU_APP_NAME }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Ludonimbus ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  # Open a PR on microsoft/winget-pkgs for the new version. Needs the
  # WINGET_TOKEN secret (classic PAT, public_repo scope); skipped without it.
  winget:
    needs: release
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      KOMAC_VERSION: 2.17.2
      KOMAC_SHA256: b03b020eec98acfb0b53e284a6e21815b884be33de6785b97e7a120f0e748966
    steps:
      - name: Submit to winget
        if: env.WINGET_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          curl -fsSL -o komac.tar.gz "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${KOMAC_SHA256}  komac.tar.gz" | sha256sum -c -
          tar -xzf komac.tar.gz komac
          ./komac update Shupian0510.Ludonimbus \
            --version "$version" \
            --urls "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Ludonimbus_${version}_x64-setup.exe" \
            --release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --submit
