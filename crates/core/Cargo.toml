[package]
name = "ludonimbus-core"
description = "Ludonimbus sync engine: save discovery, snapshots, cloud providers, Steam shortcuts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
serde_yaml = "0.9"
ulid = "1"
blake3 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
globset = "0.4"
walkdir = "2"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
percent-encoding = "2"
roxmltree = "0.20"
dirs = "5"
opener = "0.7"
keyring = { version = "3", features = ["windows-native"] }
crc32fast = "1"
notify = "9.0.0"
aes = "0.8"
zstd = { version = "0.13", default-features = false }
# Reading compressed saves for their game version (crosssaves.rs).
flate2 = "1"
ico = "0.6"
# The Switch client's LAN connection (nxlan.rs): HTTPS with a self-signed certificate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux: passwords go to the Secret Service (KWallet / GNOME Keyring) when
# there is one, else to a file only this user can read (see credstore.rs).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
dav-server = "0.12.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
md-5 = "0.10"
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros"] }
